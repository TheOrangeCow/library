<!DOCTYPE html>
<html>
<head>
    <title>Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.ico') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
</head>
<body>
    <div id="header">
        <h1>Library <span style="font-weight:400;color:#e8b84b;font-size:0.85rem;">· Home</span></h1>
        <span class="you-label">Playing as <b>{{ username }}</b></span>
        <span style="font-size:0.75rem; color:#7a6030; margin-left:1rem;">
            Join Code: <b style="color:var(--gold); letter-spacing:0.08em;">{{ join_code }}</b>
            <span style="color:#7a6030; font-size:0.7rem;">(changes hourly)</span>
        </span>
        <a class="logout" href="/logout">Logout</a>
    </div><br>

    <div id="games">
        <h1 style="padding: 1rem 1.4rem;">Games</h1>



        <div id="" style="padding: 1rem 1.4rem;">
            <div class="game-card">
                <h2>Poo</h2>
                <a href="/pooheads">Play Pooheads →</a>
            </div>
        </div>
        <div id="" style="padding: 1rem 1.4rem;">
            <div class="game-card">
                <h2>black</h2>
                <a href="/blackjack">Play Pooheads →</a>
            </div>
        </div>
        <div id="" style="padding: 1rem 1.4rem;">
            <div class="game-card">
                <h2>Pocker</h2>
                <a href="/poker">Play Pooheads →</a>
            </div>
        </div>
        <div id="" style="padding: 1rem 1.4rem;">
            <div class="game-card">
                <h2>weel</h2>
                <a href="/slots">Play Pooheads →</a>
            </div>
        </div>
        <div id="" style="padding: 1rem 1.4rem;">
            <div class="game-card">
                <h2>7</h2>
                <a href="/sevens">Play Pooheads →</a>
            </div>
        </div>


</body>
</html>
