<!DOCTYPE html>
<html data-theme="{{ theme }}">

<head>
    <title>Crash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('pooheads.static', filename='style.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.ico') }}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <div id="header">
        <h1>Library <span style="font-weight:400;color: var(--gold);font-size:0.85rem;">· Crash</span></h1>
        <span class="you-label">Playing as <b>{{ username }}</b></span>
        <span>
            <a class="logout" href="/">Back</a>
        </span>
    </div><br>

    <nav class="nav">
        <div class="nav-pill" id="nav-pill">
            <div class="slider" id="nav-slider"></div>
            <a href="#rooms">Rooms</a>
            <a href="#rules">Rules</a>
            <a href="#strategy">Strategy</a>
        </div>
    </nav>

    <div id="rooms" style="padding: 1rem 1.4rem; display: none;">
        <div class="game-card">
            <h1>Rooms</h1>
            <h2>Join a Public Room</h2>
            <div id="public-rooms-list" style="margin-bottom:1rem;">
                <p style="color: var(--gold-dim);font-size:0.85rem;">Loading rooms...</p>
            </div>
            <br>

            <h2>Join Private Room</h2>
            <p style="font-size:0.85rem;color: var(--gold-dim);">Have a code? Enter it below to join a private or public
                room.</p>

            <form method="POST" action="/crash/join">
                <input class="index" type="text" name="code" placeholder="6-digit room code" maxlength="6"
                    autocomplete="off">
                <button class="index" type="submit">Join</button>
            </form>
            <br><br>
            <h2>Create Room</h2>

            <form method="POST" action="/crash/create">
                <label style="font-size:0.85rem;color: var(--gold-dim);">
                    <input class="index" type="checkbox" name="public" id="pub" checked>
                </label><br><br>
                <button class="index" type="submit">Create Game</button>
            </form>



            {% if request.args.get('error') %}
            <p style="color: var(--gold)">{{ request.args.get('error') }}</p>
            {% endif %}

        </div>



    </div>

    <script>
    function loadPublicRooms() {
        fetch('/crash/rooms')
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('public-rooms-list');
                if (!data.rooms.length) {
                    el.innerHTML = '<p style="color: var(--gold-dim);font-size:0.85rem;font-style:italic;">No open public rooms right now.</p>';
                    return;
                }
                el.innerHTML = data.rooms.map(r => `
                <div style="display:flex;justify-content:space-between;align-items:center;
                            padding:0.5rem 0;border-bottom:1px solid rgba(212,168,67,0.1);">
                    <span style="color:var(--gold-dim);font-size:0.85rem;">
                        Room <b style="color:var(--gold)">${r.code}</b>
                    </span>
                    <span style="color: var(--gold-dim);font-size:0.8rem;">${r.players}/${r.max} players</span>
                    <form method="POST" style="margin:0;">
                        <input type="hidden" name="room_code" value="${r.code}">
                        <button class="index" type="submit" name="join" 
                            style="font-size:0.75rem;padding:0.2rem 0.7rem;">
                            Join →
                        </button>
                    </form>
                </div>
            `).join('');
            });
    }

    loadPublicRooms();
    setInterval(loadPublicRooms, 5000);

        const socket = io();
        socket.on("connect", () => {
            socket.emit("set_page", { page: `Lobby` });
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'hidden') {
                socket.emit('tab_hidden');
            } else {
                socket.emit('tab_visible');
            }
        });

        const pill = document.getElementById('nav-pill');
        const slider = document.getElementById('nav-slider');

        function moveSlider(el) {
            slider.style.left = el.offsetLeft + 'px';
            slider.style.width = el.offsetWidth + 'px';
        }

        function hide(el) {
            const pages = ["rooms", "rules", "strategy"];
            for (const page of pages) {
                if (page !== el) {
                    document.getElementById(page).style.display = "none";
                } else {
                    document.getElementById(page).style.display = "";
                }
            }
        }

        pill.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function () {
                pill.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                this.classList.add('active');
                moveSlider(this);
                hide(this.getAttribute('href').slice(1));
            });
        });

        function init() {
            const first = pill.querySelector('a');
            first.classList.add('active');
            moveSlider(first);
            hide('rooms');
        }

        if (document.fonts) {
            document.fonts.ready.then(init);
        } else {
            window.addEventListener('load', init);
        }

        window.addEventListener('resize', () => {
            const cur = pill.querySelector('a.active');
            if (cur) moveSlider(cur);
        });
    </script>
</body>

</html>
