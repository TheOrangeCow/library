<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRASH — #{{ code }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080a0f;
    --surface: #0d1017;
    --border:  #1c2030;
    --accent:  #e8ff47;
    --red:     #ff3c5a;
    --blue:    #7dd3fc;
    --text:    #c8d0e0;
    --muted:   #4a5268;
    --glow:    0 0 32px rgba(232,255,71,.22);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }

  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(28,32,48,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28,32,48,.5) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 1fr 280px;
    height: 100vh;
    gap: 0;
  }

  /* ── TOP BAR ── */
  #topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 20px;
    justify-content: space-between;
  }

  .tb-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-right: 24px;
  }

  .tb-code {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
  }
  .tb-code span { color: var(--text); }

  .tb-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .chips-display {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .chips-display::before { content: '◈ '; opacity: .5; }

  .tb-user {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .leave-btn {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: color .15s, border-color .15s;
    text-decoration: none;
  }
  .leave-btn:hover { color: var(--red); border-color: var(--red); }

  /* ── MAIN STAGE ── */
  #stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
    overflow: hidden;
    gap: 0;
  }

  #phase-label {
    position: absolute;
    top: 20px; left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color .3s;
  }

  #multiplier {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 14vw, 140px);
    letter-spacing: 0.04em;
    color: var(--accent);
    text-shadow: var(--glow);
    line-height: 1;
    transition: color .2s, text-shadow .2s;
    position: relative;
    z-index: 1;
  }
  #multiplier.crashed {
    color: var(--red);
    text-shadow: 0 0 32px rgba(255,60,90,.35);
    animation: shake .25s ease;
  }
  #multiplier.countdown-mode {
    font-size: clamp(64px, 10vw, 100px);
    color: var(--blue);
    text-shadow: 0 0 32px rgba(125,211,252,.3);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px) rotate(-1deg); }
    40%      { transform: translateX(6px) rotate(1deg); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }

  #sub-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.14em;
    margin-top: 8px;
    min-height: 20px;
    text-transform: uppercase;
  }

  #cashout-area {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    padding: 0 20px;
  }

  #cashout-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.14em;
    padding: 14px 56px;
    background: var(--accent);
    color: #080a0f;
    border: none;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    display: none;
    position: relative;
    overflow: hidden;
  }
  #cashout-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.2), transparent 50%);
    pointer-events: none;
  }
  #cashout-btn:hover { opacity: .88; }
  #cashout-btn:active { transform: scale(.97); }
  #cashout-btn.visible { display: block; }

  #rocket {
    position: absolute;
    font-size: 36px;
    bottom: 120px; left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity .3s;
    user-select: none;
    pointer-events: none;
    filter: drop-shadow(0 0 12px var(--accent));
  }
  #rocket.flying { opacity: 1; animation: rocket-float 1.4s ease-in-out infinite alternate; }
  #rocket.crashed { opacity: 1; filter: drop-shadow(0 0 16px var(--red)); animation: none; }
  @keyframes rocket-float {
    from { transform: translateX(-50%) translateY(0) rotate(-8deg); }
    to   { transform: translateX(-50%) translateY(-18px) rotate(8deg); }
  }

  .trail {
    position: absolute;
    bottom: 120px; left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 0;
    background: linear-gradient(to bottom, rgba(232,255,71,0), rgba(232,255,71,.35));
    transition: height .15s linear;
    pointer-events: none;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  #bet-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .amount-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .quick-btn {
    flex: 1;
    min-width: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 7px 4px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: color .15s, border-color .15s;
    text-align: center;
  }
  .quick-btn:hover { color: var(--accent); border-color: rgba(232,255,71,.4); }

  #bet-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .2s;
  }
  #bet-input:focus { border-color: var(--accent); }

  #bet-btn {
    width: 100%;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 0.12em;
    background: var(--accent);
    color: #080a0f;
    border: none;
    padding: 11px;
    cursor: pointer;
    transition: opacity .15s;
  }
  #bet-btn:hover { opacity: .85; }
  #bet-btn:disabled { opacity: .25; cursor: default; }

  #start-btn {
    width: 100%;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 0.12em;
    background: transparent;
    color: var(--blue);
    border: 1px solid rgba(125,211,252,.4);
    padding: 11px;
    cursor: pointer;
    transition: background .15s, color .15s;
    margin-top: 8px;
    display: none;
  }
  #start-btn:hover { background: rgba(125,211,252,.08); }
  #start-btn.visible { display: block; }

  #players-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 18px;
  }
  #players-list::-webkit-scrollbar { width: 3px; }
  #players-list::-webkit-scrollbar-thumb { background: var(--border); }

  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(28,32,48,.7);
    gap: 8px;
  }
  .player-row:last-child { border-bottom: none; }

  .p-name {
    font-size: 12px;
    color: var(--text);
    letter-spacing: 0.04em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .p-name.is-host::after { content: ' ★'; color: var(--accent); font-size: 10px; }

  .p-bet {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .p-bet.cashed { color: var(--accent); }
  .p-bet.lost   { color: var(--red); opacity: .5; }

  #error-toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(255,60,90,.12);
    border: 1px solid rgba(255,60,90,.4);
    color: var(--red);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 10px 24px;
    transition: transform .25s ease, opacity .25s;
    opacity: 0;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }
  #error-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  #cashout-toast {
    position: fixed;
    top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-40px);
    background: rgba(232,255,71,.1);
    border: 1px solid rgba(232,255,71,.4);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.12em;
    padding: 12px 32px;
    transition: transform .3s ease, opacity .3s;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
  }
  #cashout-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  #lobby-overlay {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(8,10,15,.7);
    backdrop-filter: blur(2px);
    z-index: 10;
  }
  #lobby-overlay .lo-text {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #lobby-overlay .lo-code {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--text);
    letter-spacing: 0.1em;
  }
  #lobby-overlay .lo-share {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div id="app">

  <div id="topbar">
    <div style="display:flex;align-items:center;gap:20px;">
      <div class="tb-logo">Crash</div>
      <div class="tb-code">Room <span>#{{ code }}</span></div>
    </div>
    <div class="tb-right">
      <div class="chips-display" id="chips-disp">{{ chips }}</div>
      <div class="tb-user">{{ username }}</div>
      <a href="/crash" class="leave-btn">Leave</a>
    </div>
  </div>

  <div id="stage">
    <div id="lobby-overlay">
      <div class="lo-text">Room Code</div>
      <div class="lo-code">#{{ code }}</div>
      <div class="lo-share">Share this code with friends</div>
    </div>

    <div class="trail" id="trail"></div>
    <div id="rocket">🚀</div>

    <div id="phase-label">LOBBY</div>
    <div id="multiplier">1.00×</div>
    <div id="sub-label"></div>

    <div id="cashout-area">
      <button id="cashout-btn" onclick="cashout()">CASH OUT</button>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Place Bet</div>
      <div id="bet-form">
        <div class="amount-row">
          <button class="quick-btn" onclick="setAmt(50)">50</button>
          <button class="quick-btn" onclick="setAmt(100)">100</button>
          <button class="quick-btn" onclick="setAmt(250)">250</button>
          <button class="quick-btn" onclick="setAmt(500)">500</button>
        </div>
        <input type="number" id="bet-input" placeholder="Amount" min="1">
        <button id="bet-btn" onclick="placeBet()">Bet</button>
        <button id="start-btn" onclick="startGame()">Start Round</button>
      </div>
    </div>

    <div class="sidebar-label" style="padding:12px 18px 0;">Players</div>
    <div id="players-list"></div>
  </div>

</div>

<div id="error-toast"></div>
<div id="cashout-toast"></div>

<script>
const USERNAME = "{{ username }}";
const CODE     = "{{ code }}";
let state      = null;
let myChips    = {{ chips }};
let trailH     = 0;

const socket = io();

socket.on("connect", () => {
  socket.emit("crash_join_room", { username: USERNAME, code: CODE });
});

socket.on("crash_state", (s) => {
  state = s;
  render();
});

socket.on("crash_error", (d) => showError(d.msg));

socket.on("crash_cashed_out", (d) => {
  myChips += d.winnings;
  document.getElementById('chips-disp').textContent = myChips;
  showCashoutToast(`+${d.winnings} @ ${d.multiplier}×`);
});

socket.on("disconnect", () => showError("Disconnected — trying to reconnect…"));

function render() {
  if (!state) return;

  const mult   = document.getElementById('multiplier');
  const phase  = document.getElementById('phase-label');
  const sub    = document.getElementById('sub-label');
  const overlay= document.getElementById('lobby-overlay');
  const rocket = document.getElementById('rocket');
  const trail  = document.getElementById('trail');
  const cashBtn= document.getElementById('cashout-btn');
  const betBtn = document.getElementById('bet-btn');
  const startBtn=document.getElementById('start-btn');

  const p = state.phase;

  mult.className = '';
  rocket.className = '';
  cashBtn.classList.remove('visible');

  if (p === 'lobby') {
    overlay.style.display = 'flex';
    mult.textContent = '1.00×';
    phase.textContent = 'LOBBY';
    sub.textContent = 'Waiting for host to start';
    trail.style.height = '0';
    trailH = 0;
    if (state.host === USERNAME) startBtn.classList.add('visible');
    else startBtn.classList.remove('visible');
    betBtn.disabled = false;

  } else if (p === 'countdown') {
    overlay.style.display = 'none';
    mult.classList.add('countdown-mode');
    mult.textContent = state.countdown;
    phase.textContent = 'LAUNCHING IN';
    sub.textContent = 'Place your bets';
    startBtn.classList.remove('visible');
    betBtn.disabled = false;
    trail.style.height = '0';
    trailH = 0;

  } else if (p === 'flying') {
    overlay.style.display = 'none';
    mult.textContent = state.multiplier.toFixed(2) + '×';
    phase.textContent = 'FLYING';
    sub.textContent = '';
    startBtn.classList.remove('visible');
    betBtn.disabled = true;
    rocket.classList.add('flying');
    trailH = Math.min(trailH + 6, 280);
    trail.style.height = trailH + 'px';

    const myBet = state.bets[USERNAME];
    if (myBet && !myBet.cashed_out) {
      cashBtn.classList.add('visible');
      cashBtn.textContent = `CASH OUT  ${(myBet.amount * state.multiplier).toFixed(0)}`;
    }

  } else if (p === 'crashed') {
    overlay.style.display = 'none';
    mult.classList.add('crashed');
    mult.textContent = (state.crash_at || state.multiplier).toFixed(2) + '×';
    phase.textContent = 'CRASHED';
    sub.textContent = 'Round over';
    rocket.classList.add('crashed');
    startBtn.classList.remove('visible');
    betBtn.disabled = true;
  }

  renderPlayers();
}

function renderPlayers() {
  if (!state) return;
  const list = document.getElementById('players-list');
  list.innerHTML = state.players.map(p => {
    const bet = state.bets[p];
    let betHtml = '<span class="p-bet">—</span>';
    if (bet) {
      if (bet.cashed_out) {
        betHtml = `<span class="p-bet cashed">↑ ${bet.cashout_at}×</span>`;
      } else if (state.phase === 'crashed') {
        betHtml = `<span class="p-bet lost">✗ ${bet.amount}</span>`;
      } else {
        betHtml = `<span class="p-bet">${bet.amount}</span>`;
      }
    }
    const hostMark = state.host === p ? ' is-host' : '';
    return `<div class="player-row"><span class="p-name${hostMark}">${p}</span>${betHtml}</div>`;
  }).join('');
}

function setAmt(v) {
  document.getElementById('bet-input').value = v;
}

function placeBet() {
  const amt = parseInt(document.getElementById('bet-input').value);
  if (!amt || amt < 1) return showError('Enter a valid amount.');
  socket.emit('crash_bet', { username: USERNAME, code: CODE, amount: amt });
}

function cashout() {
  socket.emit('crash_cashout', { username: USERNAME, code: CODE });
  document.getElementById('cashout-btn').classList.remove('visible');
}

function startGame() {
  socket.emit('crash_start', { username: USERNAME, code: CODE });
}

let errTimer = null;
function showError(msg) {
  const t = document.getElementById('error-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(errTimer);
  errTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

let coTimer = null;
function showCashoutToast(msg) {
  const t = document.getElementById('cashout-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(coTimer);
  coTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

window.addEventListener('beforeunload', () => {
  socket.emit('crash_leave_room', { username: USERNAME, code: CODE });
});
</script>
</body>
</html>
