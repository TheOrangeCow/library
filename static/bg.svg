<svg width="60" height="60"
     viewBox="0 0 60 60"
     xmlns="http://www.w3.org/2000/svg">

    <polygon
        points="30,10 50,45 10,45"
        fill="rgba(245,232,176,0.08)">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="
                0 0;
                4 -3;
                -3 5;
                2 -4;
                0 0
            "
            dur="6s"
            repeatCount="indefinite"/>

        <animateTransform
            attributeName="transform"
            additive="sum"
            type="rotate"
            values="
                0 30 30;
                8 30 30;
                -6 30 30;
                0 30 30
            "
            dur="8s"
            repeatCount="indefinite"/>

    </polygon>

</svg>